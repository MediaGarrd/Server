server:
  port: ${SERVER_PORT:8080}

mediagarrd:
  backup-interval: ${MEDIAGARRD_BACKUP_INTERVAL:PT12H}
  backup-root: ${MEDIAGARRD_BACKUP_ROOT:/var/lib/mediagarrd/backups}
  retention-count: ${MEDIAGARRD_RETENTION_COUNT:10}
  database-path: ${MEDIAGARRD_DATABASE_PATH:/var/lib/mediagarrd/db/mediagarrd.db}
  helper-image: ${MEDIAGARRD_HELPER_IMAGE:busybox:stable}
